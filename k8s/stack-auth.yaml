apiVersion: apps/v1
kind: Deployment
metadata:
  name: stack-auth
  namespace: stack-auth
  labels:
    app: stack-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stack-auth
  template:
    metadata:
      labels:
        app: stack-auth
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: stack-auth
          image: stackauthacr2025.azurecr.io/stack-auth/server:amd64
          ports:
            - containerPort: 8101
              name: dashboard
            - containerPort: 8102
              name: backend
          env:
            - name: NODE_ENV
              value: "production"
            - name: STACK_DATABASE_CONNECTION_STRING
              value: "postgresql://postgres:password@postgres.stack-auth.svc.cluster.local:5432/stackframe"
            - name: STACK_SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: stack-auth-secrets
                  key: stack-server-secret
            - name: STACK_JS_EXECUTION_ENGINE
              value: "self-hosted-sandbox"
            - name: STACK_SANDBOX_API_URL
              value: "http://sandbox-api.stack-auth-sandbox.svc.cluster.local:8080"
            - name: STACK_SANDBOX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stack-auth-secrets
                  key: stack-sandbox-api-token
            - name: STACK_SANDBOX_TIMEOUT_MS
              value: "90000"
            - name: STACK_SANDBOX_ALLOWED_MODULES
              value: "react@19.1.1,react-dom@19.1.1,@react-email/components@1.0.6,arktype@2.1.20"
            - name: NEXT_PUBLIC_STACK_API_URL
              value: "https://api.manjuauth.aivida.in"
            - name: NEXT_PUBLIC_STACK_DASHBOARD_URL
              value: "https://manjuauth.aivida.in"
            - name: STACK_SEED_INTERNAL_PROJECT_SIGN_UP_ENABLED
              value: "true"
            - name: STACK_SEED_INTERNAL_PROJECT_ALLOW_LOCALHOST
              value: "true"
            - name: STACK_SEED_INTERNAL_PROJECT_OTP_ENABLED
              value: "true"
            - name: STACK_SEED_INTERNAL_PROJECT_USER_EMAIL
              value: "admin@manjuwellness.com"
            - name: STACK_SEED_INTERNAL_PROJECT_USER_PASSWORD
              value: "Admin123456!"
            - name: STACK_SEED_INTERNAL_PROJECT_USER_INTERNAL_ACCESS
              value: "true"
            - name: STACK_SKIP_SEED_SCRIPT
              value: "true"
            - name: STACK_SKIP_MIGRATIONS
              value: "true"
            - name: STACK_SEED_INTERNAL_PROJECT_PUBLISHABLE_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: stack-auth-secrets
                  key: stack-seed-internal-project-publishable-client-key
            - name: STACK_SEED_INTERNAL_PROJECT_SECRET_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: stack-auth-secrets
                  key: stack-seed-internal-project-secret-server-key
            - name: STACK_SEED_INTERNAL_PROJECT_SUPER_SECRET_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: stack-auth-secrets
                  key: stack-seed-internal-project-super-secret-admin-key
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 8102
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8102
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: stack-auth-backend
  namespace: stack-auth
  labels:
    app: stack-auth
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8102
      name: backend
  selector:
    app: stack-auth
---
apiVersion: v1
kind: Service
metadata:
  name: stack-auth-dashboard
  namespace: stack-auth
  labels:
    app: stack-auth
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8101
      name: dashboard
  selector:
    app: stack-auth
