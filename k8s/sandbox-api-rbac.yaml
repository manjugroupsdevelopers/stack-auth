apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-api
  namespace: stack-auth-sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-runner
  namespace: stack-auth-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-api-job-manager
  namespace: stack-auth-sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-api-job-manager
  namespace: stack-auth-sandbox
subjects:
  - kind: ServiceAccount
    name: sandbox-api
    namespace: stack-auth-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-api-job-manager
